name: TM library CPU tests

on:
  pull_request:
    paths:
      - 'tm_library/**'
      - 'tests/tm_library/**'
      - 'configs/tm_library/**'
      - 'requirements-tm-library.txt'
      - 'photofinishing/photofinishing_model.py'
      - 'photofinishing/models/**'
      - 'utils/constants.py'
      - '.github/workflows/tm-library-tests.yml'
  push:
    paths:
      - 'tm_library/**'
      - 'tests/tm_library/**'
      - 'configs/tm_library/**'
      - 'requirements-tm-library.txt'
      - 'photofinishing/photofinishing_model.py'
      - 'photofinishing/models/**'
      - 'utils/constants.py'
      - '.github/workflows/tm-library-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-tm-library.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-tm-library.txt pytest
      - name: Test TM algorithms, data and training
        run: python -m pytest tests/tm_library -q
