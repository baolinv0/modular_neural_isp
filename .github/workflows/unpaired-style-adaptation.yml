name: Unpaired Photofinishing Style Adaptation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'photofinishing/unpaired_style/**'
      - 'photofinishing/train_unpaired_style.py'
      - 'photofinishing/eval_unpaired_style.py'
      - 'photofinishing/unpaired_style_default.json'
      - 'tests/test_unpaired_style_*.py'
      - '.github/workflows/unpaired-style-adaptation.yml'
  push:
    branches:
      - feature/unpaired-photofinishing-style-adaptation
    paths:
      - 'photofinishing/unpaired_style/**'
      - 'photofinishing/train_unpaired_style.py'
      - 'photofinishing/eval_unpaired_style.py'
      - 'photofinishing/unpaired_style_default.json'
      - 'tests/test_unpaired_style_*.py'
      - '.github/workflows/unpaired-style-adaptation.yml'

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pillow pytest
      - name: Compile experiment code
        run: |
          python -m compileall -q \
            photofinishing/unpaired_style \
            photofinishing/train_unpaired_style.py \
            photofinishing/eval_unpaired_style.py
      - name: Run targeted tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_unpaired_style_*.py
