name: Unpaired Photofinishing

on:
  pull_request:
    paths:
      - 'photofinishing/unpaired_*.py'
      - 'photofinishing/evaluate/**'
      - 'photofinishing/README_UNPAIRED_STYLE.md'
      - 'tests/test_unpaired_*.py'
      - '.github/workflows/unpaired-photofinishing.yml'
  push:
    branches:
      - feature/unpaired-photofinishing-style
      - feature/unpaired-photofinishing-affine-chroma
    paths:
      - 'photofinishing/unpaired_*.py'
      - 'photofinishing/evaluate/**'
      - 'photofinishing/README_UNPAIRED_STYLE.md'
      - 'tests/test_unpaired_*.py'
      - '.github/workflows/unpaired-photofinishing.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q torch==2.5.1 numpy==1.26.4 opencv-python-headless==4.11.0.86 pytest
      - run: python -m compileall -q photofinishing
      - name: Focused unit and training smoke tests
        run: >-
          pytest -q --tb=short
          tests/test_unpaired_reference_data.py
          tests/test_unpaired_style_losses.py
          tests/test_unpaired_stage_control.py
          tests/test_unpaired_training.py
          tests/test_unpaired_cli.py
          tests/test_unpaired_chroma_heads.py
          tests/test_unpaired_chroma_stage2.py
          tests/test_unpaired_eval_heads.py
      - name: Non-aligned evaluation tests
        run: pytest -q --tb=short photofinishing/evaluate/tests
      - name: Real Photofinishing interface canary
        run: pytest -vv --tb=short tests/test_unpaired_real_interface.py
